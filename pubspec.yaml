name: hostel_buddy
description: "Hostel Buddy - Find your fit. Fill your rooms."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: 14.0.2
  get: ^4.7.3
  get_storage: ^2.1.1
  google_maps_flutter: 2.14.0
  google_sign_in: ^7.2.0
  image_cropper: ^12.2.1
  image_picker: 1.2.2
  permission_handler: ^13.0.2
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#6B0E24"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  remove_alpha_ios: true
# Pinned to releases that build with Flutter 3.35.x (newer ones need Flutter >= 3.38 / AGP 9).
# Remove these once the Flutter SDK is upgraded.
dependency_overrides:
  permission_handler_android: 13.0.1
  google_sign_in_android: 7.2.2
  image_picker_android: 0.8.13+5
  shared_preferences_android: 2.4.15
  google_maps_flutter_android: 2.18.4
